# Patrick 11/13 12:25pm: one grouped weekly Dependabot PR per ecosystem.
# Each ecosystem has a minor/patch group and a separate major group, so at most
# 2 open Dependabot PRs per ecosystem (open-pull-requests-limit: 2).
# Major bumps wait for an independent review.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      major:
        update-types:
          - 'major'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      major:
        update-types:
          - 'major'
  - package-ecosystem: 'docker'
    directory: '/seminary_sidekick_backend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      major:
        update-types:
          - 'major'
  - package-ecosystem: 'pip'
    directory: '/seminary_sidekick_backend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      major:
        update-types:
          - 'major'

# Patrick 11/13 12:25pm: one grouped weekly Dependabot PR per ecosystem.
# Each ecosystem has a minor/patch group and a separate major group, so at most
# 2 open Dependabot PRs per ecosystem (open-pull-requests-limit: 2).
# Major bumps wait for an independent review.
# Patrick 11/14 5:48pm (Actions over quota): monthly instead of weekly, same groups.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      major:
        update-types:
          - 'major'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    # SvelteKit 3 (kit 3, adapter-vercel 7, TypeScript 7) needs a planned migration: svelte.config.js to vite config, $lib to #lib, $env to $app/env.
    ignore:
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/adapter-vercel'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      major:
        update-types:
          - 'major'
  - package-ecosystem: 'docker'
    directory: '/seminary_sidekick_backend'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      major:
        update-types:
          - 'major'
  - package-ecosystem: 'pip'
    directory: '/seminary_sidekick_backend'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    # SQLAlchemy 1.4 to 2.x changes the ORM layer and cannot be verified without a database; do it as a planned migration.
    ignore:
      - dependency-name: 'SQLAlchemy'
        update-types: ['version-update:semver-major']
      - dependency-name: 'sqlacodegen'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      major:
        update-types:
          - 'major'
